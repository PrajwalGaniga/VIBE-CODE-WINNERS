<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe Coding Small Hackathon — Results</title>
    <meta name="description" content="Official results announcement for the Vibe Coding Small Hackathon. A cinematic space-themed celebration of creativity, code, and vision." />
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Syne: main display/hero headings | Space Grotesk: UI/supporting | Bebas Neue: countdown digits & rank labels -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#030509] text-white">
    <audio id="bgm" src="/assets/bgm.mpeg" loop preload="auto"></audio>
    <script>
      (function() {
        var bgm = document.getElementById('bgm');
        if (!bgm) return;
        bgm.volume = 0.22;
        var startBgm = function() {
          if (bgm.dataset.userMuted === 'true') return;
          bgm.play().catch(function() {});
        };
        startBgm();
        ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'scroll', 'click'].forEach(function(evt) {
          window.addEventListener(evt, startBgm, { once: true, passive: true });
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
